<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아이프리 마이캐릭터 도감</title>

<style>
:root {
  --theme: #e5e5e5;
  --theme-dark: #777777;
  --theme-light: #f7f7f7;
  --theme-text: #333333;
  --border: #dddddd;
  --text: #303a30;
  --subtext: #858d81;
  --background: #ffffff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px;
  background: var(--background);
  color: var(--text);
  font-family: Arial, "Malgun Gothic", sans-serif;
}

button, input { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: 0.45; cursor: not-allowed; }

button:focus-visible, input:focus-visible {
  outline: 2px solid var(--theme-dark);
  outline-offset: 2px;
}

.page {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
}

h1 {
  margin: 0 0 24px;
  text-align: center;
  font-size: 27px;
}

.character-area { margin-bottom: 20px; }

.character-list {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 8px;
  height: 92px;
  overflow-y: auto;
  margin-bottom: 12px;
  padding: 2px;
}

.character-button {
  padding: 5px 10px;
  font-size: 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
  color: var(--text);
  overflow-wrap: anywhere;
  transition: background 0.15s, border-color 0.15s;
}

.character-button:hover { background: var(--theme-light); }

.character-button.active {
  border-color: var(--theme-dark);
  background: var(--theme);
  color: var(--theme-text);
  font-weight: bold;
}

.character-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.btn {
  padding: 10px 15px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: var(--text);
}

.btn:hover:not(:disabled) { background: var(--theme-light); }

.btn-primary {
  border-color: var(--theme);
  background: var(--theme);
  color: var(--theme-text);
  font-weight: bold;
}

.btn-primary:hover:not(:disabled) { background: var(--theme-light); }
.btn-danger { color: #b34d4d; }

.name-area {
  margin-bottom: 20px;
  padding: 15px 18px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: white;
}

.name-label {
  margin-bottom: 6px;
  color: var(--subtext);
  font-size: 13px;
}

.character-name {
  font-size: 22px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.empty-message {
  padding: 22px 12px;
  color: var(--subtext);
  text-align: center;
}

.parts-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 12px;
}

.part-card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: white;
}

.part-title {
  min-height: 43px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 4px;
  background: var(--theme-light);
  border-bottom: 1px solid var(--border);
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.part-preview {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  aspect-ratio: 1 / 1;
  padding: 7px;
  border: 0;
  background: white;
  transition: background 0.15s;
}

.part-preview:hover { background: var(--theme-light); }

.part-preview img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.part-placeholder {
  color: #a6afa0;
  font-size: 12px;
  text-align: center;
}

.part-name {
  min-height: 34px;
  padding: 7px 4px;
  border-top: 1px solid var(--border);
  text-align: center;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(35, 45, 33, 0.42);
}

.modal-overlay.is-open { display: flex; }

.modal {
  width: min(440px, 100%);
  max-height: 90dvh;
  overflow-y: auto;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: white;
  box-shadow: 0 12px 45px rgba(35, 45, 33, 0.18);
}

.modal h2 {
  margin: 0 0 16px;
  font-size: 20px;
}

.modal-description {
  margin: 0 0 16px;
  color: var(--subtext);
  font-size: 14px;
  line-height: 1.6;
}

.modal-input {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  background: white;
}

.modal-buttons {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 18px;
}

#partsModal .modal {
  width: min(760px, 90vw, 82dvh);
  height: min(760px, 90vw, 82dvh);
  max-height: none;
  aspect-ratio: 1 / 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  overflow: hidden;
}

.parts-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-shrink: 0;
  margin-bottom: 12px;
}

.parts-modal-header h2 {
  margin: 0;
  font-size: 18px;
}

.close-btn {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: var(--text);
  font-size: 20px;
}

.parts-modal-content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 2px;
}

.parts-options {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.image-option {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  aspect-ratio: 1 / 1;
  padding: 5px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
}

.image-option:hover {
  border-color: var(--theme-dark);
  background: var(--theme-light);
}

.image-option img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.clear-option {
  color: var(--subtext);
  font-size: 30px;
}

.parts-empty {
  grid-column: 1 / -1;
  padding: 24px 8px;
  color: var(--subtext);
  text-align: center;
  font-size: 14px;
}

@media (max-width: 1000px) {
  .parts-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}

@media (max-width: 600px) {
  body { padding: 14px; }
  h1 { font-size: 22px; }

  .parts-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .part-title { font-size: 12px; }

  #partsModal .modal {
    width: min(90vw, 82dvh);
    height: min(90vw, 82dvh);
    padding: 12px;
  }

  .parts-options {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 7px;
  }
}
</style>
</head>

<body>
<div class="page">
  <h1 id="pageTitle"></h1>

  <section class="character-area">
    <div class="character-list" id="characterList"></div>
    <div class="character-tools">
      <button class="btn btn-primary" id="addCharacterButton"></button>
      <button class="btn btn-danger" id="deleteCharacterButton"></button>
    </div>
  </section>

  <section class="name-area">
    <div class="name-label" id="nameLabel"></div>
    <div class="character-name" id="characterName"></div>
  </section>

  <main class="parts-grid" id="partsGrid"></main>
</div>

<!-- 캐릭터 추가 -->
<div class="modal-overlay" id="addCharacterModal">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
    <h2 id="addModalTitle"></h2>
    <p class="modal-description" id="addModalDescription"></p>
    <form id="addCharacterForm">
      <input class="modal-input" id="newCharacterName" type="text" maxlength="80" required>
      <div class="modal-buttons">
        <button type="button" class="btn" data-close="addCharacterModal" id="addCancelButton"></button>
        <button type="submit" class="btn btn-primary" id="addConfirmButton"></button>
      </div>
    </form>
  </section>
</div>

<!-- 캐릭터 삭제 확인 -->
<div class="modal-overlay" id="deleteCharacterModal">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
    <h2 id="deleteModalTitle"></h2>
    <p class="modal-description" id="deleteModalDescription"></p>
    <div class="modal-buttons">
      <button type="button" class="btn" data-close="deleteCharacterModal" id="deleteCancelButton"></button>
      <button type="button" class="btn btn-danger" id="deleteConfirmButton"></button>
    </div>
  </section>
</div>

<!-- 파츠 선택 -->
<div class="modal-overlay" id="partsModal">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="partsModalTitle">
    <header class="parts-modal-header">
      <h2 id="partsModalTitle"></h2>
      <button type="button" class="close-btn" data-close="partsModal" aria-label="닫기">×</button>
    </header>
    <div class="parts-modal-content">
      <div class="parts-options" id="partsOptions"></div>
    </div>
  </section>
</div>

<script>
const TEXT = {
  pageTitle: "아이프리 마이캐릭터 도감",
  addCharacter: "캐릭터 추가",
  deleteCharacter: "캐릭터 삭제",
  nameLabel: "이름",
  addModalTitle: "캐릭터 추가",
  addModalDescription: "추가할 캐릭터의 이름을 입력하세요.",
  namePlaceholder: "캐릭터 이름",
  cancel: "취소",
  addConfirm: "추가",
  deleteModalTitle: "캐릭터 삭제",
  deleteModalDescription: "이 캐릭터를 삭제하시겠습니까? 선택한 파츠 정보도 함께 삭제됩니다.",
  deleteConfirm: "삭제",
  choosePartTitle: "파츠 선택",
  noCharacter: "먼저 캐릭터를 추가해 주세요.",
  noPart: "아직 등록된 파츠가 없습니다.",
  noSelection: "선택 안 함",
  clearPart: "선택 해제",
  categoryNames: {
    face: "얼굴",
    voice: "보이스",
    skin: "피부",
    bangs: "앞머리",
    backHair: "뒷머리",
    hairColor: "헤어 컬러",
    eyeColor: "아이 컬러",
    messageType: "메시 타입",
    messageColor: "메시 컬러",
    hairDecoration: "헤어 데코",
    makeup: "메이크업",
    onePoint: "원 포인트",
    jewelry: "부탁해 주얼"
  }
};

/* 헤어 컬러와 메시 컬러가 공유하는 이미지 목록 */
const SHARED_COLOR_PARTS = [];

/* 파츠 이미지 목록 */
const PARTS = {
  face: [
    { name: "おとめ", image: "images/parts/Face_0001.webp" },
    { name: "げんき", image: "images/parts/Face_0002.webp" },
    { name: "ほんわか", image: "images/parts/Face_0003.webp" },
    { name: "ひたむき", image: "images/parts/Face_0004.webp" },
    { name: "ハツラツ", image: "images/parts/Face_0005.webp" },
    { name: "ビューティー", image: "images/parts/Face_0006.webp" },
    { name: "ロマンチック", image: "images/parts/Face_0007.webp" },
    { name: "ミステリアス", image: "images/parts/Face_0008.webp" }
  ],
  voice: [],
  skin: [],
  bangs: [],
  backHair: [],
  hairColor: SHARED_COLOR_PARTS,
  eyeColor: [],
  messageType: [],
  messageColor: SHARED_COLOR_PARTS,
  hairDecoration: [],
  makeup: [],
  onePoint: [],
  jewelry: [
    {
      name: "すき",
      image: "images/parts/Jewel_0001.webp",
      theme: { name: "すき", main: "#F9D8EB", dark: "#B52D78", light: "#FFF0F8", text: "#642044", border: "#EFC0DC" }
    },
    {
      name: "ゆめ",
      image: "images/parts/Jewel_0002.webp",
      theme: { name: "ゆめ", main: "#D6F2FA", dark: "#2187A8", light: "#EFFBFE", text: "#174B5D", border: "#B6E4F0" }
    },
    {
      name: "ゆうじょう",
      image: "images/parts/Jewel_0003.webp",
      theme: { name: "ゆうじょう", main: "#DDF5D9", dark: "#398A47", light: "#F1FBEF", text: "#254D2B", border: "#C2E8BD" }
    },
    {
      name: "ゆうき",
      image: "images/parts/Jewel_0004.webp",
      theme: { name: "ゆうき", main: "#FFF2C2", dark: "#A88417", light: "#FFFAE8", text: "#5B4912", border: "#F0E0A0" }
    },
    {
      name: "じょうねつ",
      image: "images/parts/Jewel_0005.webp",
      theme: { name: "じょうねつ", main: "#F9D7DC", dark: "#B8243B", light: "#FFF0F2", text: "#651C2A", border: "#F0B9C2" }
    },
    {
      name: "きぼう",
      image: "images/parts/Jewel_0006.webp",
      theme: { name: "きぼう", main: "#E9DDFB", dark: "#7040B4", light: "#F7F1FF", text: "#402568", border: "#D4C0F3" }
    }
  ]
};

/* 주얼을 선택하기 전의 기본 색상 */
const DEFAULT_THEME = {
  name: "기본",
  main: "#e5e5e5",
  dark: "#777777",
  light: "#f7f7f7",
  text: "#333333",
  border: "#dddddd"
};

const categories = Object.keys(TEXT.categoryNames);
let characters = [];
let currentCharacterIndex = -1;

const $ = id => document.getElementById(id);

function setText(id, text) {
  $(id).textContent = text;
}

function initializeText() {
  setText("pageTitle", TEXT.pageTitle);
  setText("addCharacterButton", TEXT.addCharacter);
  setText("deleteCharacterButton", TEXT.deleteCharacter);

  setText("addModalTitle", TEXT.addModalTitle);
  setText("addModalDescription", TEXT.addModalDescription);
  setText("addCancelButton", TEXT.cancel);
  setText("addConfirmButton", TEXT.addConfirm);
  $("newCharacterName").placeholder = TEXT.namePlaceholder;

  setText("deleteModalTitle", TEXT.deleteModalTitle);
  setText("deleteModalDescription", TEXT.deleteModalDescription);
  setText("deleteCancelButton", TEXT.cancel);
  setText("deleteConfirmButton", TEXT.deleteConfirm);
}

/* 모달 열기 / 닫기 */
function openModal(id) {
  $(id).classList.add("is-open");
}

function closeModal(id) {
  $(id).classList.remove("is-open");
}

function closeAllModals() {
  document.querySelectorAll(".modal-overlay").forEach(modal => {
    modal.classList.remove("is-open");
  });
}

document.querySelectorAll("[data-close]").forEach(button => {
  button.addEventListener("click", () => closeModal(button.dataset.close));
});

document.querySelectorAll(".modal-overlay").forEach(overlay => {
  overlay.addEventListener("click", event => {
    if (event.target === overlay && overlay.id !== "deleteCharacterModal") {
      closeModal(overlay.id);
    }
  });
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeAllModals();
});

/* 주얼에 따른 테마 적용 */
function getThemeForCharacter(character) {
  if (!character) return DEFAULT_THEME;
  return character.parts?.jewelry?.theme || DEFAULT_THEME;
}

function getCurrentTheme() {
  if (currentCharacterIndex < 0) return DEFAULT_THEME;
  return getThemeForCharacter(characters[currentCharacterIndex]);
}

function applyTheme() {
  const theme = getCurrentTheme();
  const root = document.documentElement;

  root.style.setProperty("--theme", theme.main);
  root.style.setProperty("--theme-dark", theme.dark);
  root.style.setProperty("--theme-light", theme.light);
  root.style.setProperty("--theme-text", theme.text);
  root.style.setProperty("--border", theme.border);
}

/* 캐릭터 버튼 목록 */
function renderCharacters() {
  const list = $("characterList");
  list.replaceChildren();

  characters.forEach((character, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "character-button";
    button.textContent = character.name;

    const characterTheme = getThemeForCharacter(character);
    button.style.backgroundColor = index === currentCharacterIndex
      ? characterTheme.main
      : characterTheme.light;
    button.style.borderColor = characterTheme.border;
    button.style.color = characterTheme.text;

    if (index === currentCharacterIndex) {
      button.classList.add("active");
      button.setAttribute("aria-pressed", "true");
    } else {
      button.setAttribute("aria-pressed", "false");
    }

    button.addEventListener("click", () => {
      currentCharacterIndex = index;
      applyTheme();
      renderCharacters();
      renderName();
      renderParts();
    });

    list.appendChild(button);
  });

  $("deleteCharacterButton").disabled = currentCharacterIndex < 0;
}

function renderName() {
  $("characterName").textContent =
    currentCharacterIndex >= 0
      ? characters[currentCharacterIndex].name
      : "";
}

/* 캐릭터 추가 */
$("addCharacterButton").addEventListener("click", () => {
  $("newCharacterName").value = "";
  openModal("addCharacterModal");
  $("newCharacterName").focus();
});

$("addCharacterForm").addEventListener("submit", event => {
  event.preventDefault();

  const name = $("newCharacterName").value.trim();
  if (!name) {
    $("newCharacterName").focus();
    return;
  }

  characters.push({
    name,
    parts: {}
  });

  currentCharacterIndex = characters.length - 1;

  closeModal("addCharacterModal");
  applyTheme();
  renderCharacters();
  renderName();
  renderParts();
});

/* 캐릭터 삭제 */
$("deleteCharacterButton").addEventListener("click", () => {
  if (currentCharacterIndex < 0) return;
  openModal("deleteCharacterModal");
});

$("deleteConfirmButton").addEventListener("click", () => {
  if (currentCharacterIndex < 0) return;

  characters.splice(currentCharacterIndex, 1);
  currentCharacterIndex = characters.length
    ? Math.min(currentCharacterIndex, characters.length - 1)
    : -1;

  closeModal("deleteCharacterModal");
  applyTheme();
  renderCharacters();
  renderName();
  renderParts();
});

/* 파츠 그리드 */
function renderParts() {
  const grid = $("partsGrid");
  grid.replaceChildren();

  categories.forEach(category => {
    const card = document.createElement("article");
    card.className = "part-card";

    const title = document.createElement("div");
    title.className = "part-title";
    title.textContent = TEXT.categoryNames[category];
    card.appendChild(title);

    const preview = document.createElement("button");
    preview.type = "button";
    preview.className = "part-preview";
    preview.title = TEXT.choosePartTitle;
    preview.setAttribute(
      "aria-label",
      TEXT.categoryNames[category] + " - " + TEXT.choosePartTitle
    );

    const selected = currentCharacterIndex >= 0
      ? characters[currentCharacterIndex].parts[category]
      : null;

    if (selected && selected.none !== true) {
      const image = document.createElement("img");
      image.src = selected.image;
      image.alt = selected.name;
      preview.appendChild(image);
    } else if (!selected && currentCharacterIndex >= 0) {
      const placeholder = document.createElement("span");
      placeholder.className = "part-placeholder";
      placeholder.textContent = "+";
      placeholder.style.fontSize = "24px";
      preview.appendChild(placeholder);
    } else if (currentCharacterIndex < 0) {
      const placeholder = document.createElement("span");
      placeholder.className = "part-placeholder";
      placeholder.textContent = "+";
      placeholder.style.fontSize = "24px";
      preview.appendChild(placeholder);
    }

    preview.addEventListener("click", () => {
      if (currentCharacterIndex < 0) {
        $("newCharacterName").value = "";
        openModal("addCharacterModal");
        $("newCharacterName").focus();
        return;
      }

      openPartsModal(category);
    });

    card.appendChild(preview);

    const partName = document.createElement("div");
    partName.className = "part-name";
    partName.textContent =
      selected && selected.none !== true ? selected.name : " ";
    card.appendChild(partName);

    grid.appendChild(card);
  });
}

/* 파츠 선택 모달 */
function openPartsModal(category) {
  if (currentCharacterIndex < 0) return;

  $("partsModalTitle").textContent = TEXT.categoryNames[category];

  const options = $("partsOptions");
  options.replaceChildren();

  // 파츠 없음: 선택하면 화면에 아무것도 표시하지 않습니다.
  const blankButton = document.createElement("button");
  blankButton.type = "button";
  blankButton.className = "image-option";
  blankButton.title = "파츠 없음 (적용하지 않음)";
  blankButton.setAttribute(
    "aria-label",
    "파츠 없음 (적용하지 않음)"
  );

  blankButton.addEventListener("click", () => {
    characters[currentCharacterIndex].parts[category] = {
      none: true,
      name: "",
      image: ""
    };

    closeModal("partsModal");
    applyTheme();
    renderCharacters();
    renderParts();
  });

  options.appendChild(blankButton);

  // 파츠 미선택으로 되돌리는 버튼
  const clearButton = document.createElement("button");
  clearButton.type = "button";
  clearButton.className = "image-option";
  clearButton.title = "선택 해제";
  clearButton.setAttribute("aria-label", "선택 해제");

  const clearText = document.createElement("span");
  clearText.className = "clear-option";
  clearText.textContent = "×";
  clearButton.appendChild(clearText);

  clearButton.addEventListener("click", () => {
    characters[currentCharacterIndex].parts[category] = null;
    closeModal("partsModal");
    applyTheme();
    renderCharacters();
    renderParts();
  });

  options.appendChild(clearButton);

  const parts = PARTS[category] || [];

  if (parts.length === 0) {
    const empty = document.createElement("div");
    empty.className = "parts-empty";
    empty.textContent = TEXT.noPart;
    options.appendChild(empty);
  }

  parts.forEach(part => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "image-option";
    button.title = part.name;
    button.setAttribute("aria-label", part.name);

    const image = document.createElement("img");
    image.src = part.image;
    image.alt = part.name;
    image.loading = "lazy";

    image.addEventListener("error", () => button.remove());
    button.appendChild(image);

    button.addEventListener("click", () => {
      characters[currentCharacterIndex].parts[category] = part;
      closeModal("partsModal");
      applyTheme();
      renderCharacters();
      renderParts();
    });

    options.appendChild(button);
  });

  openModal("partsModal");
}

/* 실행 */
initializeText();
applyTheme();
renderCharacters();
renderName();
renderParts();
</script>
</body>
</html>
