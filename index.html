<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이캐릭터 파츠 정리</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500&family=Jua&display=swap" rel="stylesheet">

<style>
:root {
  --theme: #e5e5e5;
  --theme-dark: #777777;
  --theme-light: #f7f7f7;
  --theme-text: #333333;
  --border: #dddddd;
  --text: #303a30;
  --subtext: #858d81;
  --background: #ffffff;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px;
  background: var(--background);
  color: var(--text);
  font-family: "IBM Plex Sans KR", "IBM Plex Sans JP", sans-serif;
}

button, input { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: 0.45; cursor: not-allowed; }

button:focus-visible, input:focus-visible {
  outline: 2px solid var(--theme-dark);
  outline-offset: 2px;
}

.page {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
}

h1 {
  margin: 0;
  text-align: left;
  font-size: 27px;
}

/* 이미지 저장 패널: 상단 오른쪽 */
.export-panel {
  position: absolute;
  top: 28px;
  right: max(24px, calc((100vw - 1200px) / 2));
  width: 250px;
  padding: 8px 10px;
  color: var(--text);
}
.export-heading-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.export-heading { font-family: "IBM Plex Sans KR", "IBM Plex Sans JP", sans-serif; font-size: 21px; font-weight: 500; white-space: nowrap; }
.export-button { padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--theme); color: var(--theme-text); font-size: 13px; white-space: nowrap; }
.export-check-row { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 2px; }
.export-note { margin: 0 0 0 22px; font-size: 10px; color: var(--subtext); line-height: 1.35; }
@media (max-width: 760px) {
  .export-panel { position: static; width: 100%; padding: 0; margin: 0 0 16px; }
}

.character-area {
  display: grid;
  width: 76%;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas:
    "header"
    "list";
  column-gap: 0;
  row-gap: 6px;
  align-items: center;
  margin-bottom: 20px;
}

.character-header { grid-area: header; display: flex; align-items: center; justify-content: flex-start; gap: 16px; min-width: 0; }

#pageTitle {
  white-space: nowrap;
  text-align: left;
  font-family: "Jua", sans-serif;
  font-size: 22px;
}

.character-list {
  grid-area: list;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start;
  align-content: flex-start;
  gap: 8px;
  height: 60px;
  overflow-y: auto;
  overflow-x: hidden;
  margin: 0;
  padding: 2px;
}

.character-button {
  padding: 5px 10px;
  font-size: 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
  color: var(--text);
  overflow-wrap: anywhere;
  transition: background 0.15s, border-color 0.15s;
}
.character-button:hover { background: var(--theme-light); }

.character-button.active {
  border-color: var(--theme-dark);
  background: var(--theme);
  color: var(--theme-text);
  font-weight: bold;
}

.character-tools {
  display: flex;
  justify-content: flex-start;
  flex-wrap: wrap;
  gap: 8px;
}

.btn {
  padding: 10px 15px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: var(--text);
}

.btn:hover:not(:disabled) { background: var(--theme-light); }

.btn-primary {
  border-color: var(--theme);
  background: var(--theme);
  color: var(--theme-text);
  font-weight: bold;
}

.btn-primary:hover:not(:disabled) { background: var(--theme-light); }
.btn-danger { color: #b34d4d; }

.name-area {
  margin-bottom: 20px;
  padding: 0 18px;
  height: 70px;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: white;
}

.name-label {
  display: none;
}

.character-name {
  flex: 1;
  min-width: 0;
  font-size: 22px;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.name-edit-button {
  flex: 0 0 auto;
  padding: 6px 10px;
  font-size: 13px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: white;
  color: var(--text);
  cursor: pointer;
}
.name-edit-button:hover { background: var(--theme-light); }
.name-edit-button[hidden] { display: none; }

.empty-message {
  padding: 22px 12px;
  color: var(--subtext);
  text-align: center;
}

.parts-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 12px;
}

.part-card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: white;
}

.part-title {
  min-height: 43px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 4px;
  background: var(--theme-light);
  border-bottom: 1px solid var(--border);
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.part-preview {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  aspect-ratio: 1 / 1;
  padding: 7px;
  border: 0;
  background: white;
  transition: background 0.15s;
}

.part-preview:hover { background: var(--theme-light); }

.part-preview img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.part-placeholder {
  color: #a6afa0;
  font-size: 12px;
  text-align: center;
}

.part-name {
  min-height: 34px;
  padding: 7px 4px;
  border-top: 1px solid var(--border);
  text-align: center;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(35, 45, 33, 0.42);
}

.modal-overlay.is-open { display: flex; }

.modal {
  width: min(440px, 100%);
  max-height: 90dvh;
  overflow-y: auto;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: white;
  box-shadow: 0 12px 45px rgba(35, 45, 33, 0.18);
}

.modal h2 {
  margin: 0 0 16px;
  font-size: 20px;
}

.modal-description {
  margin: 0 0 16px;
  color: var(--subtext);
  font-size: 14px;
  line-height: 1.6;
}

.modal-input {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  background: white;
}

.modal-buttons {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 18px;
}

#partsModal .modal {
  width: min(760px, 90vw, 82dvh);
  height: min(760px, 90vw, 82dvh);
  max-height: none;
  aspect-ratio: 1 / 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  overflow: hidden;
}

.parts-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-shrink: 0;
  margin-bottom: 12px;
}

.parts-modal-header h2 {
  margin: 0;
  font-size: 18px;
}

.close-btn {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: var(--text);
  font-size: 20px;
}

.parts-modal-content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 2px;
}

.parts-options {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.image-option {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  aspect-ratio: 1 / 1;
  padding: 5px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
}

.image-option:hover {
  border-color: var(--theme-dark);
  background: var(--theme-light);
}

.image-option img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.clear-option {
  color: var(--subtext);
  font-size: 30px;
}

.parts-empty {
  grid-column: 1 / -1;
  padding: 24px 8px;
  color: var(--subtext);
  text-align: center;
  font-size: 14px;
}


/* 캐릭터 미리보기와 파츠 선택 레이아웃 */
.editor-layout {
  display: grid;
  grid-template-columns: minmax(240px, 0.8fr) minmax(0, 1.7fr);
  gap: 22px;
  align-items: start;
}
.preview-panel {
  position: sticky;
  top: 16px;
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #fff;
}
.preview-heading { margin: 0 0 12px; font-size: 18px; }
.character-preview {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  border-radius: 10px;
  background: linear-gradient(135deg, #fafafa, #f1f1f1);
  isolation: isolate;
}
.character-preview .preview-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}
.preview-empty {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; text-align: center; color: #888;
  font-size: 14px; line-height: 1.6;
}
.preview-caption { margin: 9px 0 0; color: var(--subtext); font-size: 11px; line-height: 1.5; }
.parts-panel { min-width: 0; }
.parts-panel .parts-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.parts-panel .parts-grid > .part-card:nth-child(4) { grid-column-start: 1; }

@media (max-width: 1000px) {
  .parts-panel .parts-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}

@media (max-width: 600px) {
  body { padding: 14px; }
  h1 { font-size: 22px; }
  .character-area { width: 100%; }
  .character-header { gap: 8px; flex-wrap: nowrap; }
  #pageTitle { font-size: 20px; }
  .character-list { height: 60px; }
  .character-button { max-width: 100%; }

  .editor-layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .preview-panel { position: static; }
  .character-preview { max-height: 420px; margin: 0 auto; }
  .parts-panel .parts-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }

  .part-title { font-size: 12px; }

  #partsModal .modal {
    width: min(90vw, 82dvh);
    height: min(90vw, 82dvh);
    padding: 12px;
  }

  .parts-options {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 7px;
  }
}
</style>
</head>

<body>
<div class="page">
  <section class="export-panel" aria-label="이미지 저장">
    <div class="export-heading-row">
      <div class="export-heading">이미지로 저장</div>
      <button type="button" class="export-button" id="exportImageButton">저장</button>
    </div>
    <label class="export-check-row"><input type="checkbox" id="omitPreviewCheckbox"> 미리보기 이미지 미포함</label>
    <p class="export-note">체크 시 빈칸으로 저장됩니다.</p>
  </section>
  <section class="character-area">
    <div class="character-header">
      <h1 id="pageTitle"></h1>
      <div class="character-tools">
        <button class="btn btn-primary" id="addCharacterButton"></button>
        <button class="btn btn-danger" id="deleteCharacterButton"></button>
      </div>
    </div>
    <div class="character-list" id="characterList"></div>
  </section>

  <section class="name-area">
    <div class="name-label" id="nameLabel"></div>
    <div class="character-name" id="characterName"></div>
    <button type="button" class="name-edit-button" id="editCharacterNameButton" hidden>수정</button>
  </section>

  <section class="editor-layout">
    <aside class="preview-panel">
      <h2 class="preview-heading">캐릭터 미리보기</h2>
      <div class="character-preview" id="characterPreview" aria-label="선택한 파츠 미리보기">
        <div class="preview-empty" id="previewEmpty">캐릭터를 추가한 뒤 파츠를 선택해 주세요.</div>
      </div>
      <p class="preview-caption">미리보기 이미지로, 실제 인게임 적용 이미지는 다를 수 있습니다.</p>
    </aside>
    <div class="parts-panel">
      <main class="parts-grid" id="partsGrid"></main>
    </div>
  </section>
</div>

<!-- 캐릭터 추가 -->
<div class="modal-overlay" id="addCharacterModal">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
    <h2 id="addModalTitle"></h2>
    <p class="modal-description" id="addModalDescription"></p>
    <form id="addCharacterForm">
      <input class="modal-input" id="newCharacterName" type="text" maxlength="80" required>
      <div class="modal-buttons">
        <button type="button" class="btn" data-close="addCharacterModal" id="addCancelButton"></button>
        <button type="submit" class="btn btn-primary" id="addConfirmButton"></button>
      </div>
    </form>
  </section>
</div>

<!-- 캐릭터 이름 수정 -->
<div class="modal-overlay" id="editCharacterNameModal">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="editNameModalTitle">
    <h2 id="editNameModalTitle">이름 수정</h2>
    <p class="modal-description" id="editNameModalDescription">캐릭터 이름을 수정하세요.</p>
    <form id="editCharacterNameForm">
      <input class="modal-input" id="editCharacterNameInput" type="text" maxlength="80" required>
      <div class="modal-buttons">
        <button type="button" class="btn" data-close="editCharacterNameModal" id="editNameCancelButton">취소</button>
        <button type="submit" class="btn btn-primary" id="editNameConfirmButton">수정</button>
      </div>
    </form>
  </section>
</div>

<!-- 캐릭터 삭제 확인 -->
<div class="modal-overlay" id="deleteCharacterModal">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
    <h2 id="deleteModalTitle"></h2>
    <p class="modal-description" id="deleteModalDescription"></p>
    <div class="modal-buttons">
      <button type="button" class="btn" data-close="deleteCharacterModal" id="deleteCancelButton"></button>
      <button type="button" class="btn btn-danger" id="deleteConfirmButton"></button>
    </div>
  </section>
</div>

<!-- 파츠 선택 -->
<div class="modal-overlay" id="partsModal">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="partsModalTitle">
    <header class="parts-modal-header">
      <h2 id="partsModalTitle"></h2>
      <button type="button" class="close-btn" data-close="partsModal" aria-label="닫기">×</button>
    </header>
    <div class="parts-modal-content">
      <div class="parts-options" id="partsOptions"></div>
    </div>
  </section>
</div>

/* 주얼을 선택하기 전의 기본 색상 */
const DEFAULT_THEME = {
  name: "기본",
  main: "#e5e5e5",
  dark: "#777777",
  light: "#f7f7f7",
  text: "#333333",
  border: "#dddddd"
};

// 화면에 표시할 파츠 카테고리 순서
const categories = [
  "face", "voice", "jewelry",
  "skin", "bangs", "backHair", "hairColor", "eyeColor",
  "messageType", "messageColor", "hairDecoration", "makeup", "onePoint"
];
let characters = [];
let currentCharacterIndex = -1;

// 새로고침 후에도 캐릭터와 선택한 파츠를 유지합니다.
const SAVE_KEY = "aipriMyCharaState_v1";
function saveState() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ characters, currentCharacterIndex }));
  } catch (error) {
    console.warn("저장에 실패했습니다.", error);
  }
}
function loadState() {
  try {
    const saved = localStorage.getItem(SAVE_KEY);
    if (!saved) return;
    const state = JSON.parse(saved);
    if (state && Array.isArray(state.characters)) {
      characters = state.characters;
      const index = Number.isInteger(state.currentCharacterIndex) ? state.currentCharacterIndex : -1;
      currentCharacterIndex = characters.length ? Math.max(-1, Math.min(index, characters.length - 1)) : -1;
    }
  } catch (error) {
    console.warn("저장된 데이터를 불러오지 못했습니다.", error);
  }
}

const $ = id => document.getElementById(id);

function setText(id, text) {
  $(id).textContent = text;
}

function initializeText() {
  setText("pageTitle", TEXT.pageTitle);
  setText("addCharacterButton", TEXT.addCharacter);
  setText("deleteCharacterButton", TEXT.deleteCharacter);

  setText("addModalTitle", TEXT.addModalTitle);
  setText("addModalDescription", TEXT.addModalDescription);
  setText("addCancelButton", TEXT.cancel);
  setText("addConfirmButton", TEXT.addConfirm);
  $("newCharacterName").placeholder = TEXT.namePlaceholder;

  setText("deleteModalTitle", TEXT.deleteModalTitle);
  setText("deleteModalDescription", TEXT.deleteModalDescription);
  setText("deleteCancelButton", TEXT.cancel);
  setText("deleteConfirmButton", TEXT.deleteConfirm);
}

/* 모달 열기 / 닫기 */
function openModal(id) {
  $(id).classList.add("is-open");
}

function closeModal(id) {
  $(id).classList.remove("is-open");
}

function closeAllModals() {
  document.querySelectorAll(".modal-overlay").forEach(modal => {
    modal.classList.remove("is-open");
  });
}

document.querySelectorAll("[data-close]").forEach(button => {
  button.addEventListener("click", () => closeModal(button.dataset.close));
});

document.querySelectorAll(".modal-overlay").forEach(overlay => {
  overlay.addEventListener("click", event => {
    if (event.target === overlay && overlay.id !== "deleteCharacterModal") {
      closeModal(overlay.id);
    }
  });
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeAllModals();
});

/* 주얼에 따른 테마 적용 */
function getThemeForCharacter(character) {
  if (!character) return DEFAULT_THEME;
  return character.parts?.jewelry?.theme || DEFAULT_THEME;
}

function getCurrentTheme() {
  if (currentCharacterIndex < 0) return DEFAULT_THEME;
  return getThemeForCharacter(characters[currentCharacterIndex]);
}

function applyTheme() {
  const theme = getCurrentTheme();
  const root = document.documentElement;

  root.style.setProperty("--theme", theme.main);
  root.style.setProperty("--theme-dark", theme.dark);
  root.style.setProperty("--theme-light", theme.light);
  root.style.setProperty("--theme-text", theme.text);
  root.style.setProperty("--border", theme.border);
}

/* 선택한 캐릭터를 고정 크기의 PNG 파츠 시트로 내보냅니다. */
async function exportCharacterImage() {
  if (currentCharacterIndex < 0) {
    alert("먼저 캐릭터를 추가해 주세요.");
    return;
  }
  const character = characters[currentCharacterIndex];
  const exportTheme = getThemeForCharacter(character);
  const canvas = document.createElement("canvas");
  // 가로형 고정 출력 이미지: 왼쪽 미리보기 + 오른쪽 3-5-5 파츠 표
  canvas.width = 1800;
  canvas.height = 840;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = exportTheme.dark;
  ctx.font = "bold 42px 'Jua', sans-serif";
  ctx.textAlign = "center";
  const previewBox = { x: 48, y: 100, w: 390, h: 390 };
  ctx.fillText(character.name || "이름 없는 캐릭터", previewBox.x + previewBox.w / 2, 62, previewBox.w);
  // 이후 텍스트도 모두 가운데 정렬합니다.

  const omitPreview = $("omitPreviewCheckbox").checked;
  const roundedRect = (x, y, w, h, r) => {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  };
  if (omitPreview) {
    // 체크 시 모서리가 둥근 미리보기 영역을 실제 투명하게 저장
    ctx.save();
    roundedRect(previewBox.x, previewBox.y, previewBox.w, previewBox.h, 22);
    ctx.clip();
    ctx.clearRect(previewBox.x, previewBox.y, previewBox.w, previewBox.h);
    ctx.restore();
  } else {
    roundedRect(previewBox.x, previewBox.y, previewBox.w, previewBox.h, 22);
    ctx.fillStyle = exportTheme.light;
    ctx.fill();
    ctx.strokeStyle = exportTheme.border;
    ctx.stroke();
    ctx.fillStyle = "#858d81";
    ctx.font = "18px 'IBM Plex Sans KR', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("미리보기 이미지 없음", previewBox.x + previewBox.w / 2, previewBox.y + previewBox.h / 2);
  }

  // 선택하지 않은 파츠도 빠뜨리지 않고 모든 카테고리를 내보냅니다.
  const entries = categories.map(category => ({ category, part: character.parts[category] || null }));
  const gridX = 480, gridY = 100;
  const gapX = 12, gapY = 14;
  const cellW = 244, cellH = 230;
  // 화면 순서 그대로 3개 / 5개 / 5개로 배치
  const rowLayout = [entries.slice(0, 3), entries.slice(3, 8), entries.slice(8, 13)];
  for (let row = 0; row < rowLayout.length; row++) {
    const rowEntries = rowLayout[row];
    for (let col = 0; col < rowEntries.length; col++) {
      const { category, part } = rowEntries[col];
      const x = gridX + col * (cellW + gapX);
      const y = gridY + row * (cellH + gapY);
      roundedRect(x, y, cellW, cellH, 18);
      ctx.fillStyle = exportTheme.light;
      ctx.fill();
      ctx.strokeStyle = exportTheme.border;
      ctx.stroke();
      // 파츠 칸 안의 글자는 중앙 정렬하며 선택한 주얼 테마 색상을 적용합니다.
      ctx.fillStyle = exportTheme.text;
      ctx.font = "bold 18px 'IBM Plex Sans KR', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(TEXT.categoryNames[category] || category, x + cellW / 2, y + 28, cellW - 24);

      if (part && part.none !== true && part.image) {
        try {
          const img = new Image();
          img.src = part.image;
          await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; });
          // 파츠 명칭은 내보내지 않으므로 이미지에 더 많은 공간을 줍니다.
          const maxW = cellW - 20, maxH = 188;
          const scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);
          const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
          ctx.save();
          roundedRect(x, y, cellW, cellH, 18);
          ctx.clip();
          ctx.drawImage(img, x + (cellW - w) / 2, y + 34 + (maxH - h) / 2, w, h);
          ctx.restore();
        } catch (e) { /* 이미지 로딩 실패 시에도 카테고리와 이름 칸은 유지 */ }
      }
    }
  }

  const link = document.createElement("a");
  link.download = `${character.name.replace(/[\\/:*?"<>|]/g, "_") || "캐릭터"}_파츠.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}
$("exportImageButton").addEventListener("click", exportCharacterImage);

/* 캐릭터 버튼 목록 */
function renderCharacters() {
  const list = $("characterList");
  list.replaceChildren();

  characters.forEach((character, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "character-button";
    button.textContent = character.name;

    const characterTheme = getThemeForCharacter(character);
    button.style.backgroundColor = index === currentCharacterIndex
      ? characterTheme.main
      : characterTheme.light;
    button.style.borderColor = characterTheme.border;
    button.style.color = characterTheme.text;

    if (index === currentCharacterIndex) {
      button.classList.add("active");
      button.setAttribute("aria-pressed", "true");
    } else {
      button.setAttribute("aria-pressed", "false");
    }

    button.addEventListener("click", () => {
      currentCharacterIndex = index;
      saveState();
      applyTheme();
      renderCharacters();
      renderName();
      renderParts();
    });

    list.appendChild(button);
  });

  $("deleteCharacterButton").disabled = currentCharacterIndex < 0;
  $("editCharacterNameButton").hidden = currentCharacterIndex < 0;
}

function renderName() {
  $("characterName").textContent =
    currentCharacterIndex >= 0
      ? characters[currentCharacterIndex].name
      : "";
  $("editCharacterNameButton").hidden = currentCharacterIndex < 0;
}

/* 선택한 캐릭터의 이름만 수정합니다. 기존 추가창과 같은 모달 안에서 편집합니다. */
$("editCharacterNameButton").addEventListener("click", () => {
  if (currentCharacterIndex < 0) return;

  $("editCharacterNameInput").value = characters[currentCharacterIndex].name;
  openModal("editCharacterNameModal");
  $("editCharacterNameInput").focus();
  $("editCharacterNameInput").select();
});

$("editCharacterNameForm").addEventListener("submit", event => {
  event.preventDefault();
  if (currentCharacterIndex < 0) {
    closeModal("editCharacterNameModal");
    return;
  }

  const name = $("editCharacterNameInput").value.trim();
  if (!name) {
    $("editCharacterNameInput").focus();
    return;
  }

  characters[currentCharacterIndex].name = name;
  saveState();
  closeModal("editCharacterNameModal");
  renderCharacters();
  renderName();
});

/* 캐릭터 추가 */
$("addCharacterButton").addEventListener("click", () => {
  $("newCharacterName").value = "";
  openModal("addCharacterModal");
  $("newCharacterName").focus();
});

$("addCharacterForm").addEventListener("submit", event => {
  event.preventDefault();

  const name = $("newCharacterName").value.trim();
  if (!name) {
    $("newCharacterName").focus();
    return;
  }

  characters.push({
    name,
    parts: {}
  });

  currentCharacterIndex = characters.length - 1;
  saveState();

  closeModal("addCharacterModal");
  applyTheme();
  renderCharacters();
  renderName();
  renderParts();
});

/* 캐릭터 삭제 */
$("deleteCharacterButton").addEventListener("click", () => {
  if (currentCharacterIndex < 0) return;
  openModal("deleteCharacterModal");
});

$("deleteConfirmButton").addEventListener("click", () => {
  if (currentCharacterIndex < 0) return;

  characters.splice(currentCharacterIndex, 1);
  currentCharacterIndex = characters.length
    ? Math.min(currentCharacterIndex, characters.length - 1)
    : -1;
  saveState();

  closeModal("deleteCharacterModal");
  applyTheme();
  renderCharacters();
  renderName();
  renderParts();
});

/* 선택된 시각 파츠를 미리보기 영역에 겹쳐 표시 */
const PREVIEW_LAYER_ORDER = ["backHair", "skin", "face", "bangs", "hairDecoration", "makeup", "onePoint", "jewelry"];
function renderCharacterPreview() {
  // 미리보기 영역의 크기와 디자인은 유지하고, 선택한 파츠 이미지는 표시하지 않습니다.
  $("characterPreview").replaceChildren();
}

/* 파츠 그리드 */
function renderParts() {
  renderCharacterPreview();
  const grid = $("partsGrid");
  grid.replaceChildren();

  categories.forEach(category => {
    const card = document.createElement("article");
    card.className = "part-card";

    const title = document.createElement("div");
    title.className = "part-title";
    title.textContent = TEXT.categoryNames[category];
    card.appendChild(title);

    const preview = document.createElement("button");
    preview.type = "button";
    preview.className = "part-preview";
    preview.title = TEXT.choosePartTitle;
    preview.setAttribute(
      "aria-label",
      TEXT.categoryNames[category] + " - " + TEXT.choosePartTitle
    );

    const selected = currentCharacterIndex >= 0
      ? characters[currentCharacterIndex].parts[category]
      : null;

    if (selected && selected.none !== true) {
      const image = document.createElement("img");
      image.src = selected.image;
      image.alt = selected.name;
      preview.appendChild(image);
    } else if (!selected && currentCharacterIndex >= 0) {
      const placeholder = document.createElement("span");
      placeholder.className = "part-placeholder";
      placeholder.textContent = "+";
      placeholder.style.fontSize = "24px";
      preview.appendChild(placeholder);
    } else if (currentCharacterIndex < 0) {
      const placeholder = document.createElement("span");
      placeholder.className = "part-placeholder";
      placeholder.textContent = "+";
      placeholder.style.fontSize = "24px";
      preview.appendChild(placeholder);
    }

    preview.addEventListener("click", () => {
      if (currentCharacterIndex < 0) {
        return;
      }

      openPartsModal(category);
    });

    card.appendChild(preview);

    const partName = document.createElement("div");
    partName.className = "part-name";
    partName.textContent =
      selected && selected.none !== true ? selected.name : " ";
    card.appendChild(partName);

    grid.appendChild(card);
  });
}

/* 파츠 선택 모달 */
function openPartsModal(category) {
  if (currentCharacterIndex < 0) return;

  $("partsModalTitle").textContent = TEXT.categoryNames[category];

  const options = $("partsOptions");
  options.replaceChildren();

  const parts = PARTS[category] || [];

  // 1. 파츠 이미지 목록을 먼저 표시
  parts.forEach(part => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "image-option";
    button.title = part.name;
    button.setAttribute("aria-label", part.name);

    const image = document.createElement("img");
    image.src = part.image;
    image.alt = part.name;
    image.loading = "lazy";

    image.addEventListener("error", () => button.remove());
    button.appendChild(image);

    button.addEventListener("click", () => {
      characters[currentCharacterIndex].parts[category] = part;
      saveState();
      closeModal("partsModal");
      applyTheme();
      renderCharacters();
      renderParts();
    });

    options.appendChild(button);
  });

  // 2. 파츠 없음: 화면에 완전히 빈칸으로 표시
  const blankButton = document.createElement("button");
  blankButton.type = "button";
  blankButton.className = "image-option";
  blankButton.title = "파츠 없음 (적용하지 않음)";
  blankButton.setAttribute(
    "aria-label",
    "파츠 없음 (적용하지 않음)"
  );

  blankButton.addEventListener("click", () => {
    characters[currentCharacterIndex].parts[category] = {
      none: true,
      name: "",
      image: ""
    };
    saveState();

    closeModal("partsModal");
    applyTheme();
    renderCharacters();
    renderParts();
  });

  options.appendChild(blankButton);

  // 3. X: 파츠 미선택 상태로 되돌리기
  const clearButton = document.createElement("button");
  clearButton.type = "button";
  clearButton.className = "image-option";
  clearButton.title = "선택 해제";
  clearButton.setAttribute("aria-label", "선택 해제");

  const clearText = document.createElement("span");
  clearText.className = "clear-option";
  clearText.textContent = "×";
  clearButton.appendChild(clearText);

  clearButton.addEventListener("click", () => {
    characters[currentCharacterIndex].parts[category] = null;
    saveState();
    closeModal("partsModal");
    applyTheme();
    renderCharacters();
    renderParts();
  });

  options.appendChild(clearButton);

  // 등록된 이미지가 없을 때 안내 문구 표시
  if (parts.length === 0) {
    const empty = document.createElement("div");
    empty.className = "parts-empty";
    empty.textContent = TEXT.noPart;
    options.insertBefore(empty, blankButton);
  }

  openModal("partsModal");
}
  
/* 실행: 저장된 내용을 먼저 복원한 뒤 화면을 그립니다. */
loadState();
initializeText();
applyTheme();
renderCharacters();
renderName();
renderParts();
</script>
