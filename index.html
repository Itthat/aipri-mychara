
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아이프리 마이캐릭터 도감</title>

<style>
/* =========================
   기본 디자인
========================= */
* {
  box-sizing: border-box;
}

:root {
  --main: #c3bbea;
  --main-dark: #7565a5;
  --border: #e6e2ef;
  --text: #352d4a;
  --subtext: #827b91;
  --background: #ffffff;
}

body {
  margin: 0;
  padding: 24px;
  background: var(--background);
  color: var(--text);
  font-family: Arial, "Malgun Gothic", sans-serif;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--main-dark);
  outline-offset: 2px;
}

.page {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
}

h1 {
  margin: 0 0 24px;
  text-align: center;
  font-size: 27px;
}

/* =========================
   캐릭터 관리 영역
   캐릭터 선택과 추가 버튼을 서로 다른 줄에 배치
========================= */
.character-tools {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 12px;
  margin-bottom: 24px;
}

.character-select-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.character-select-row label {
  font-weight: bold;
  white-space: nowrap;
}

.character-select-row select {
  flex: 1;
  min-width: 140px;
  max-width: 360px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: var(--text);
}

.character-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 15px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: var(--text);
  transition: background 0.15s;
}

.btn:hover:not(:disabled) {
  background: #f6f3fc;
}

.btn-primary {
  border-color: var(--main);
  background: var(--main);
  color: #352d4a;
  font-weight: bold;
}

.btn-primary:hover:not(:disabled) {
  background: #b5a9e4;
}

.btn-danger {
  color: #b54d65;
}

/* =========================
   캐릭터 이름
========================= */
.name-area {
  margin-bottom: 20px;
  padding: 15px 18px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
}

.name-label {
  margin-bottom: 6px;
  color: var(--subtext);
  font-size: 13px;
}

.character-name {
  font-size: 22px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.empty-message {
  padding: 28px 12px;
  color: var(--subtext);
  text-align: center;
}

/* =========================
   파츠 목록
========================= */
.parts-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 12px;
}

.part-card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: white;
}

.part-title {
  min-height: 43px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 4px;
  background: #f7f5fc;
  border-bottom: 1px solid var(--border);
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.part-preview {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  aspect-ratio: 1 / 1;
  padding: 7px;
  background: white;
}

.part-preview img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.part-placeholder {
  color: #b8b2c5;
  font-size: 12px;
  text-align: center;
}

.part-name {
  min-height: 34px;
  padding: 4px;
  text-align: center;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.part-action {
  width: 100%;
  padding: 9px 4px;
  border: 0;
  border-top: 1px solid var(--border);
  background: white;
  color: var(--main-dark);
  font-size: 12px;
}

.part-action:hover:not(:disabled) {
  background: #f7f5fc;
}

/* =========================
   화면 내부 모달 공통
========================= */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(42, 35, 58, 0.42);
}

.modal-overlay.is-open {
  display: flex;
}

.modal {
  width: min(440px, 100%);
  max-height: 90dvh;
  overflow-y: auto;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: white;
  box-shadow: 0 12px 45px rgba(42, 35, 58, 0.18);
}

.modal h2 {
  margin: 0 0 16px;
  font-size: 20px;
}

.modal-description {
  margin: 0 0 16px;
  color: var(--subtext);
  font-size: 14px;
  line-height: 1.6;
}

.modal-input {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  background: white;
}

.modal-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

/* =========================
   파츠 선택 모달
   창 자체가 항상 정사각형
========================= */
#partsModal .modal {
  width: min(760px, 90vw, 82dvh);
  height: min(760px, 90vw, 82dvh);
  max-height: none;
  aspect-ratio: 1 / 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  overflow: hidden;
}

.parts-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-shrink: 0;
  margin-bottom: 12px;
}

.parts-modal-header h2 {
  margin: 0;
  font-size: 18px;
}

.close-btn {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: var(--text);
  font-size: 20px;
}

.parts-modal-content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 2px;
}

.parts-options {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.image-option {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  aspect-ratio: 1 / 1;
  padding: 5px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
}

.image-option:hover {
  border-color: var(--main-dark);
  background: #f9f7ff;
}

.image-option img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.parts-empty {
  grid-column: 1 / -1;
  padding: 24px 8px;
  color: var(--subtext);
  text-align: center;
  font-size: 14px;
}

/* =========================
   반응형
========================= */
@media (max-width: 1000px) {
  .parts-grid {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  body {
    padding: 14px;
  }

  h1 {
    font-size: 22px;
  }

  .parts-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .part-title {
    font-size: 12px;
  }

  #partsModal .modal {
    width: min(90vw, 82dvh);
    height: min(90vw, 82dvh);
    padding: 12px;
  }

  .parts-options {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 7px;
  }
}
</style>
</head>

<body>
<div class="page">
  <h1 id="pageTitle"></h1>

  <section class="character-tools">
    <div class="character-select-row">
      <label for="characterSelect" id="characterSelectLabel"></label>
      <select id="characterSelect"></select>
    </div>

    <div class="character-buttons">
      <button class="btn btn-primary" id="addCharacterButton"></button>
      <button class="btn btn-danger" id="deleteCharacterButton"></button>
    </div>
  </section>

  <section class="name-area">
    <div class="name-label" id="nameLabel"></div>
    <div class="character-name" id="characterName"></div>
  </section>

  <main class="parts-grid" id="partsGrid"></main>
</div>

<!-- 캐릭터 추가 모달 -->
<div class="modal-overlay" id="addCharacterModal">
  <section class="modal" role="dialog" aria-modal="true"
           aria-labelledby="addModalTitle">
    <h2 id="addModalTitle"></h2>
    <p class="modal-description" id="addModalDescription"></p>
    <form id="addCharacterForm">
      <input class="modal-input" id="newCharacterName"
             type="text" maxlength="80" required>
      <div class="modal-buttons">
        <button type="button" class="btn" data-close="addCharacterModal"
                id="addCancelButton"></button>
        <button type="submit" class="btn btn-primary"
                id="addConfirmButton"></button>
      </div>
    </form>
  </section>
</div>

<!-- 캐릭터 삭제 확인 모달 -->
<div class="modal-overlay" id="deleteCharacterModal">
  <section class="modal" role="dialog" aria-modal="true"
           aria-labelledby="deleteModalTitle">
    <h2 id="deleteModalTitle"></h2>
    <p class="modal-description" id="deleteModalDescription"></p>
    <div class="modal-buttons">
      <button type="button" class="btn" data-close="deleteCharacterModal"
              id="deleteCancelButton"></button>
      <button type="button" class="btn btn-danger"
              id="deleteConfirmButton"></button>
    </div>
  </section>
</div>

<!-- 파츠 선택 모달: 창은 항상 정사각형 -->
<div class="modal-overlay" id="partsModal">
  <section class="modal" role="dialog" aria-modal="true"
           aria-labelledby="partsModalTitle">
    <header class="parts-modal-header">
      <h2 id="partsModalTitle"></h2>
      <button type="button" class="close-btn"
              data-close="partsModal" aria-label="닫기">×</button>
    </header>
    <div class="parts-modal-content">
      <div class="parts-options" id="partsOptions"></div>
    </div>
  </section>
</div>

<script>
/* =====================================================
   TEXT: 화면에 표시되는 문구
   문구를 수정하고 싶을 때 이 영역을 편집하세요.
===================================================== */
const TEXT = {
  pageTitle: "아이프리 마이캐릭터 도감",
  characterSelectLabel: "캐릭터 선택",
  selectPlaceholder: "캐릭터를 선택하세요",
  addCharacter: "캐릭터 추가",
  deleteCharacter: "캐릭터 삭제",
  nameLabel: "이름",
  addModalTitle: "캐릭터 추가",
  addModalDescription: "추가할 캐릭터의 이름을 입력하세요.",
  namePlaceholder: "캐릭터 이름",
  cancel: "취소",
  addConfirm: "추가",
  deleteModalTitle: "캐릭터 삭제",
  deleteModalDescription: "이 캐릭터를 삭제하시겠습니까? 선택한 파츠 정보도 함께 삭제됩니다.",
  deleteConfirm: "삭제",
  choosePart: "파츠 선택",
  clearPart: "선택 해제",
  noCharacter: "먼저 캐릭터를 추가해 주세요.",
  noPart: "아직 등록된 파츠가 없습니다.",
  noSelection: "선택 안 함",
  categoryNames: {
    face: "얼굴",
    voice: "보이스",
    skin: "피부",
    bangs: "앞머리",
    backHair: "뒷머리",
    hairColor: "헤어 컬러",
    eyeColor: "아이 컬러",
    messageType: "메시 타입",
    messageColor: "메시 컬러",
    hairDecoration: "헤어 데코",
    makeup: "메이크업",
    onePoint: "원 포인트",
    jewelry: "부탁해 주얼"
  }
};

/* =====================================================
   PARTS: 파츠 이미지 목록
   파일을 images/parts/ 폴더에 올린 뒤 이곳에 추가하세요.
   다른 카테고리는 이미지가 준비되면 항목을 넣으면 됩니다.
===================================================== */
const PARTS = {
  face: [
    { name: "おとめ", image: "images/parts/Face_0001.webp" },
    { name: "げんき", image: "images/parts/Face_0002.webp" },
    { name: "ほんわか", image: "images/parts/Face_0003.webp" },
    { name: "ひたむき", image: "images/parts/Face_0004.webp" },
    { name: "ハツラツ", image: "images/parts/Face_0005.webp" },
    { name: "ビューティー", image: "images/parts/Face_0006.webp" },
    { name: "ロマンチック", image: "images/parts/Face_0007.webp" },
    { name: "ミステリアス", image: "images/parts/Face_0008.webp" }
  ],
  voice: [],
  skin: [],
  bangs: [],
  backHair: [],
  hairColor: [],
  eyeColor: [],
  messageType: [],
  messageColor: [],
  hairDecoration: [],
  makeup: [],
  onePoint: [],
  jewelry: []
};

/* =====================================================
   데이터
   현재는 캐릭터를 미리 등록하지 않습니다.
   추가한 캐릭터와 선택 정보는 이 페이지를 새로고침하면
   초기화됩니다. 영구 저장은 별도 기능이 필요합니다.
===================================================== */
const categories = Object.keys(TEXT.categoryNames);

let characters = [];
let currentCharacterIndex = -1;
let currentCategory = null;

/* =====================================================
   화면 초기화
===================================================== */
const $ = (id) => document.getElementById(id);

function setText(id, value) {
  $(id).textContent = value;
}

function initializeText() {
  setText("pageTitle", TEXT.pageTitle);
  setText("characterSelectLabel", TEXT.characterSelectLabel);
  setText("addCharacterButton", TEXT.addCharacter);
  setText("deleteCharacterButton", TEXT.deleteCharacter);
  setText("nameLabel", TEXT.nameLabel);

  setText("addModalTitle", TEXT.addModalTitle);
  setText("addModalDescription", TEXT.addModalDescription);
  setText("addCancelButton", TEXT.cancel);
  setText("addConfirmButton", TEXT.addConfirm);
  $("newCharacterName").placeholder = TEXT.namePlaceholder;

  setText("deleteModalTitle", TEXT.deleteModalTitle);
  setText("deleteModalDescription", TEXT.deleteModalDescription);
  setText("deleteCancelButton", TEXT.cancel);
  setText("deleteConfirmButton", TEXT.deleteConfirm);
}

function openModal(id) {
  $(id).classList.add("is-open");
}

function closeModal(id) {
  $(id).classList.remove("is-open");
}

function closeAllModals() {
  document.querySelectorAll(".modal-overlay").forEach(modal => {
    modal.classList.remove("is-open");
  });
}

/* 모달 바깥을 클릭하면 닫기 */
document.querySelectorAll(".modal-overlay").forEach(overlay => {
  overlay.addEventListener("click", event => {
    if (event.target === overlay && overlay.id !== "deleteCharacterModal") {
      closeModal(overlay.id);
    }
  });
});

/* ESC 키로 모달 닫기 */
document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeAllModals();
  }
});

/* 모달 닫기 버튼 */
document.querySelectorAll("[data-close]").forEach(button => {
  button.addEventListener("click", () => {
    closeModal(button.dataset.close);
  });
});

/* =====================================================
   캐릭터 선택 및 관리
===================================================== */
function renderCharacters() {
  const select = $("characterSelect");
  select.replaceChildren();

  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = TEXT.selectPlaceholder;
  select.appendChild(placeholder);

  characters.forEach((character, index) => {
    const option = document.createElement("option");
    option.value = String(index);
    option.textContent = character.name;
    select.appendChild(option);
  });

  select.value = currentCharacterIndex >= 0
    ? String(currentCharacterIndex)
    : "";

  $("deleteCharacterButton").disabled = currentCharacterIndex < 0;

  renderName();
  renderParts();
}

function renderName() {
  const name = currentCharacterIndex >= 0
    ? characters[currentCharacterIndex].name
    : "";

  $("characterName").textContent = name || TEXT.noCharacter;
}

$("characterSelect").addEventListener("change", event => {
  currentCharacterIndex = event.target.value === ""
    ? -1
    : Number(event.target.value);

  renderCharacters();
});

$("addCharacterButton").addEventListener("click", () => {
  $("newCharacterName").value = "";
  openModal("addCharacterModal");
  $("newCharacterName").focus();
});

$("addCharacterForm").addEventListener("submit", event => {
  event.preventDefault();

  const name = $("newCharacterName").value.trim();
  if (!name) {
    $("newCharacterName").focus();
    return;
  }

  characters.push({
    name,
    parts: {}
  });

  currentCharacterIndex = characters.length - 1;
  closeModal("addCharacterModal");
  renderCharacters();
});

$("deleteCharacterButton").addEventListener("click", () => {
  if (currentCharacterIndex < 0) return;
  openModal("deleteCharacterModal");
});

$("deleteConfirmButton").addEventListener("click", () => {
  if (currentCharacterIndex < 0) return;

  characters.splice(currentCharacterIndex, 1);
  currentCharacterIndex = characters.length
    ? Math.min(currentCharacterIndex, characters.length - 1)
    : -1;

  closeModal("deleteCharacterModal");
  renderCharacters();
});

/* =====================================================
   파츠 목록 표시
===================================================== */
function renderParts() {
  const grid = $("partsGrid");
  grid.replaceChildren();

  categories.forEach(category => {
    const card = document.createElement("article");
    card.className = "part-card";

    const title = document.createElement("div");
    title.className = "part-title";
    title.textContent = TEXT.categoryNames[category];
    card.appendChild(title);

    const preview = document.createElement("div");
    preview.className = "part-preview";

    const selected = currentCharacterIndex >= 0
      ? characters[currentCharacterIndex].parts[category]
      : null;

    if (selected) {
      const image = document.createElement("img");
      image.src = selected.image;
      image.alt = selected.name;
      preview.appendChild(image);
    } else {
      const placeholder = document.createElement("div");
      placeholder.className = "part-placeholder";
      placeholder.textContent = currentCharacterIndex < 0
        ? "—"
        : TEXT.noSelection;
      preview.appendChild(placeholder);
    }

    card.appendChild(preview);

    const partName = document.createElement("div");
    partName.className = "part-name";
    partName.textContent = selected ? selected.name : " ";
    card.appendChild(partName);

    const button = document.createElement("button");
    button.className = "part-action";
    button.textContent = TEXT.choosePart;
    button.disabled = currentCharacterIndex < 0;
    button.addEventListener("click", () => openPartsModal(category));
    card.appendChild(button);

    grid.appendChild(card);
  });
}

/* =====================================================
   파츠 선택 모달
===================================================== */
function openPartsModal(category) {
  if (currentCharacterIndex < 0) return;

  currentCategory = category;
  $("partsModalTitle").textContent = TEXT.categoryNames[category];

  const options = $("partsOptions");
  options.replaceChildren();

  const clearButton = document.createElement("button");
  clearButton.type = "button";
  clearButton.className = "image-option";
  clearButton.title = TEXT.clearPart;
  clearButton.setAttribute("aria-label", TEXT.clearPart);

  const clearText = document.createElement("span");
  clearText.className = "part-placeholder";
  clearText.textContent = "×";
  clearText.style.fontSize = "32px";
  clearButton.appendChild(clearText);

  clearButton.addEventListener("click", () => {
    characters[currentCharacterIndex].parts[category] = null;
    closeModal("partsModal");
    renderParts();
  });

  options.appendChild(clearButton);

  const parts = PARTS[category] || [];

  if (parts.length === 0) {
    const empty = document.createElement("div");
    empty.className = "parts-empty";
    empty.textContent = TEXT.noPart;
    options.appendChild(empty);
  }

  parts.forEach(part => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "image-option";
    button.title = part.name;
    button.setAttribute("aria-label", part.name);

    const image = document.createElement("img");
    image.src = part.image;
    image.alt = part.name;
    image.loading = "lazy";

    image.addEventListener("error", () => {
      button.remove();
    });

    button.appendChild(image);

    button.addEventListener("click", () => {
      characters[currentCharacterIndex].parts[category] = part;
      closeModal("partsModal");
      renderParts();
    });

    options.appendChild(button);
  });

  openModal("partsModal");
}

/* 실행 */
initializeText();
renderCharacters();
</script>
</body>
</html>
