
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aipri My Character</title>

<style>
/* ===== 디자인 설정 영역 ===== */
:root {
  --bg: #fff8fc;
  --panel: #ffffff;
  --accent: #bd659e;
  --accent-light: #f8e6f1;
  --border: #efd6e7;
  --text: #554454;
  --subtext: #9a8495;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

header {
  padding: 30px 16px;
  text-align: center;
  background: linear-gradient(135deg, #f8dff0, #e2f8f4);
}

h1 {
  margin: 0;
  color: var(--accent);
}

main {
  max-width: 1200px;
  margin: 28px auto;
  padding: 0 16px;
}

.panel {
  margin-bottom: 22px;
  padding: 18px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
}

button, input, select {
  padding: 9px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: white;
  color: var(--text);
  font: inherit;
}

button {
  cursor: pointer;
  background: #fff0f8;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin: 12px 0;
}

.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 5px;
}

th, td {
  min-width: 115px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  text-align: center;
}

th {
  background: var(--accent-light);
  color: var(--accent);
}

td { background: white; }

.part-image {
  display: block;
  width: 100%;
  height: 115px;
  object-fit: contain;
}

.part-name {
  margin-top: 6px;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.empty {
  display: grid;
  height: 115px;
  place-items: center;
  color: #c3b3c0;
  font-size: 12px;
}

.part-select { width: 100%; }

#faceGallery {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.face-card {
  width: 125px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 10px;
  text-align: center;
}

.face-card img {
  width: 100%;
  height: 100px;
  object-fit: contain;
}

footer {
  padding: 24px;
  text-align: center;
  color: var(--subtext);
  font-size: 12px;
}

@media (max-width: 600px) {
  .panel { padding: 12px; }
  th, td { min-width: 105px; padding: 5px; }
}
</style>
</head>

<body>
<header>
  <!-- 문구 수정 영역: 사이트 제목과 부제 -->
  <h1 id="siteTitle"></h1>
  <p id="siteSubtitle"></p>
</header>

<main>
  <section class="panel">
    <!-- 문구 수정 영역: 캐릭터 목록 -->
    <h2 id="characterHeading"></h2>
    <div class="controls">
      <select id="characterSelect" aria-label="캐릭터 선택"></select>
      <button id="addCharacter"></button>
      <button id="renameCharacter"></button>
    </div>
    <div class="controls">
      <label>
        <span id="nameLabel"></span>
        <input id="characterName">
      </label>
      <button id="saveName"></button>
    </div>
    <p id="message"></p>
  </section>

  <section class="panel">
    <!-- 문구 수정 영역: 파츠 표 -->
    <h2 id="partsHeading"></h2>
    <p id="partsDescription"></p>
    <div class="table-wrap">
      <table>
        <thead><tr id="headRow"></tr></thead>
        <tbody>
          <tr id="imageRow"></tr>
          <tr id="labelRow"></tr>
          <tr id="selectRow"></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <!-- 문구 수정 영역: 파츠 목록 -->
    <h2 id="galleryHeading"></h2>
    <p id="galleryDescription"></p>
    <div id="faceGallery"></div>
  </section>
</main>

<footer id="footerText"></footer>

<script>
/* ==================================================
   1. 문구 수정 영역
   사이트에 표시되는 문구는 이곳에서 수정하세요.
   문구를 바꿔도 파츠 선택 기능은 바뀌지 않습니다.
================================================== */
const TEXT = {
  siteTitle: "Aipri My Character",
  siteSubtitle: "My Character Collection",
  characterHeading: "Characters",
  addCharacter: "+ Add Character",
  renameCharacter: "Rename",
  nameLabel: "Name",
  saveName: "Apply",
  initialMessage: "Select a character and assign parts.",
  partsHeading: "Parts",
  partsDescription: "Each character can use one part per category. Parts may be shared between characters.",
  galleryHeading: "Part List",
  galleryDescription: "Registered face parts",
  emptyCell: "—",
  selectNone: "None",
  missingImage: "Image unavailable",
  noCharacters: "Add a character to begin.",
  askCharacterName: "Enter a character name:",
  emptyName: "Please enter a name.",
  characterAdded: "Character added.",
  nameUpdated: "Name updated.",
  selectionUpdated: "Selection updated.",
  footerText: "Aipri My Character"
};

/* ==================================================
   2. 파츠 종류
================================================== */
const CATEGORIES = [
  "얼굴", "보이스", "피부", "앞머리", "뒷머리",
  "헤어 컬러", "아이 컬러", "메시 타입", "메시 컬러",
  "헤어 데코", "메이크업", "원 포인트", "부탁해 주얼"
];

/* ==================================================
   3. 파츠 데이터
   새 파츠는 해당 종류 안에
   { image: "이미지 경로", label: "파츠 이름" }
   형식으로 추가하세요.
================================================== */
const PARTS = {
  "얼굴": [
    { image: "images/parts/Face_0001.webp", label: "おとめ" },
    { image: "images/parts/Face_0002.webp", label: "げんき" },
    { image: "images/parts/Face_0003.webp", label: "ほんわか" },
    { image: "images/parts/Face_0004.webp", label: "ひたむき" },
    { image: "images/parts/Face_0005.webp", label: "ハツラツ" },
    { image: "images/parts/Face_0006.webp", label: "ビューティー" },
    { image: "images/parts/Face_0007.webp", label: "ロマンチック" },
    { image: "images/parts/Face_0008.webp", label: "ミステリアス" }
  ],
  "보이스": [],
  "피부": [],
  "앞머리": [],
  "뒷머리": [],
  "헤어 컬러": [],
  "아이 컬러": [],
  "메시 타입": [],
  "메시 컬러": [],
  "헤어 데코": [],
  "메이크업": [],
  "원 포인트": [],
  "부탁해 주얼": []
};

/* ==================================================
   4. 캐릭터 데이터
   비워 둔 상태로 시작합니다.
   캐릭터는 사이트에서 직접 추가할 수 있습니다.
================================================== */
let characters = [];
let current = -1;

/* ==================================================
   5. 기능 영역
   아래 코드는 사이트 작동을 위한 코드입니다.
================================================== */
const $ = id => document.getElementById(id);
const characterSelect = $("characterSelect");

function showText() {
  Object.keys(TEXT).forEach(key => {
    const element = $(key);
    if (element) element.textContent = TEXT[key];
  });
  $("siteTitle").textContent = TEXT.siteTitle;
  $("siteSubtitle").textContent = TEXT.siteSubtitle;
  $("characterHeading").textContent = TEXT.characterHeading;
  $("addCharacter").textContent = TEXT.addCharacter;
  $("renameCharacter").textContent = TEXT.renameCharacter;
  $("nameLabel").textContent = TEXT.nameLabel;
  $("saveName").textContent = TEXT.saveName;
  $("partsHeading").textContent = TEXT.partsHeading;
  $("partsDescription").textContent = TEXT.partsDescription;
  $("galleryHeading").textContent = TEXT.galleryHeading;
  $("galleryDescription").textContent = TEXT.galleryDescription;
  $("footerText").textContent = TEXT.footerText;
  $("message").textContent = TEXT.initialMessage;
}

function renderCharacters() {
  characterSelect.innerHTML = "";

  characters.forEach((character, index) => {
    const option = document.createElement("option");
    option.value = index;
    option.textContent = character.name;
    characterSelect.appendChild(option);
  });

  if (characters.length === 0) {
    current = -1;
    const option = document.createElement("option");
    option.value = "";
    option.textContent = TEXT.noCharacters;
    characterSelect.appendChild(option);
    $("characterName").value = "";
  } else {
    if (current < 0 || current >= characters.length) current = 0;
    characterSelect.value = current;
    $("characterName").value = characters[current].name;
  }

  renderTable();
}

function renderTable() {
  ["headRow", "imageRow", "labelRow", "selectRow"].forEach(id => {
    $(id).innerHTML = "";
  });

  const character = characters[current];

  const nameHeader = document.createElement("th");
  nameHeader.textContent = "이름 칸";
  $("headRow").appendChild(nameHeader);

  const nameImage = document.createElement("td");
  nameImage.innerHTML = '<div class="empty"></div>';
  $("imageRow").appendChild(nameImage);

  const nameLabel = document.createElement("td");
  nameLabel.textContent = character ? character.name : "";
  $("labelRow").appendChild(nameLabel);

  const nameSelect = document.createElement("td");
  nameSelect.textContent = character ? character.name : "";
  $("selectRow").appendChild(nameSelect);

  CATEGORIES.forEach(category => {
    const header = document.createElement("th");
    header.textContent = category;
    $("headRow").appendChild(header);

    const selectedLabel = character && character.selections[category];
    const selectedPart = (PARTS[category] || []).find(
      part => part.label === selectedLabel
    );

    const imageCell = document.createElement("td");
    if (selectedPart) {
      const image = document.createElement("img");
      image.className = "part-image";
      image.src = selectedPart.image;
      image.alt = selectedPart.label;
      image.onerror = () => {
        imageCell.innerHTML = "";
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = TEXT.missingImage;
        imageCell.appendChild(empty);
      };
      imageCell.appendChild(image);
    } else {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = TEXT.emptyCell;
      imageCell.appendChild(empty);
    }
    $("imageRow").appendChild(imageCell);

    const labelCell = document.createElement("td");
    labelCell.className = "part-name";
    labelCell.textContent = selectedPart ? selectedPart.label : "";
    $("labelRow").appendChild(labelCell);

    const selectCell = document.createElement("td");
    const select = document.createElement("select");
    select.className = "part-select";
    select.setAttribute("aria-label", category);

    const blank = document.createElement("option");
    blank.value = "";
    blank.textContent = TEXT.selectNone;
    select.appendChild(blank);

    (PARTS[category] || []).forEach(part => {
      const option = document.createElement("option");
      option.value = part.label;
      option.textContent = part.label;
      select.appendChild(option);
    });

    select.value = selectedLabel || "";
    select.disabled = !character || (PARTS[category] || []).length === 0;

    select.addEventListener("change", () => {
      if (!character) return;
      if (select.value) character.selections[category] = select.value;
      else delete character.selections[category];
      renderTable();
      $("message").textContent = TEXT.selectionUpdated;
    });

    selectCell.appendChild(select);
    $("selectRow").appendChild(selectCell);
  });
}

function renderGallery() {
  const gallery = $("faceGallery");
  gallery.innerHTML = "";

  (PARTS["얼굴"] || []).forEach(part => {
    const card = document.createElement("div");
    card.className = "face-card";

    const image = document.createElement("img");
    image.src = part.image;
    image.alt = part.label;

    const label = document.createElement("div");
    label.className = "part-name";
    label.textContent = part.label;

    card.append(image, label);
    gallery.appendChild(card);
  });
}

characterSelect.addEventListener("change", () => {
  current = Number(characterSelect.value);
  renderCharacters();
});

$("addCharacter").addEventListener("click", () => {
  const name = prompt(TEXT.askCharacterName);
  if (!name || !name.trim()) return;

  characters.push({ name: name.trim(), selections: {} });
  current = characters.length - 1;
  renderCharacters();
  $("message").textContent = TEXT.characterAdded;
});

$("renameCharacter").addEventListener("click", () => {
  $("characterName").focus();
});

$("saveName").addEventListener("click", () => {
  if (current < 0) {
    $("message").textContent = TEXT.noCharacters;
    return;
  }

  const name = $("characterName").value.trim();
  if (!name) {
    $("message").textContent = TEXT.emptyName;
    return;
  }

  characters[current].name = name;
  renderCharacters();
  $("message").textContent = TEXT.nameUpdated;
});

showText();
renderCharacters();
renderGallery();
</script>
</body>
</html>
