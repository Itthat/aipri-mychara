
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이프리 마이캐릭터 도감</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --border: #dedede;
  --muted: #777;
  --soft: #f6f6f6;
}

body {
  margin: 0;
  background: #fff;
  color: #333;
  font-family: Arial, "Malgun Gothic", sans-serif;
}

header {
  padding: 20px 16px;
  border-bottom: 1px solid var(--border);
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 600;
}

main {
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
  padding: 20px;
}

button, input, select {
  font: inherit;
}

button {
  padding: 8px 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  background: white;
  color: #333;
  cursor: pointer;
}

button:hover {
  background: var(--soft);
}

.character-tools {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.character-tools select,
.character-tools input {
  min-width: 120px;
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
  background: white;
}

.name-area {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding: 12px 14px;
  border: 1px solid var(--border);
}

.name-label {
  font-weight: 600;
}

#displayName {
  overflow-wrap: anywhere;
}

#message {
  margin: 8px 0 16px;
  color: var(--muted);
  font-size: 13px;
}

/* 파츠 표: 가로 스크롤 없이 화면 너비에 맞춤 */
.parts-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 8px;
}

.part-card {
  min-width: 0;
  border: 1px solid var(--border);
  background: #fff;
  text-align: center;
}

.part-category {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 38px;
  padding: 5px 3px;
  background: var(--soft);
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  overflow-wrap: anywhere;
}

.part-preview {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 112px;
  padding: 5px;
  border: 0;
  border-radius: 0;
  background: #fff;
}

.part-preview:hover {
  background: #fafafa;
}

.part-preview img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.part-empty {
  color: #bbb;
  font-size: 12px;
}

.part-label {
  min-height: 30px;
  padding: 6px 3px;
  border-top: 1px solid #eee;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.part-action {
  width: 100%;
  padding: 7px 3px;
  border: 0;
  border-top: 1px solid var(--border);
  border-radius: 0;
  font-size: 12px;
}

/* 이미지 선택 창 */
.modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(0, 0, 0, 0.45);
}

.modal.open {
  display: flex;
}

.modal-content {
  display: flex;
  flex-direction: column;
  width: min(760px, 100%);
  max-height: 85vh;
  background: white;
  border: 1px solid #ddd;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.modal-header h2 {
  margin: 0;
  font-size: 17px;
}

.modal-body {
  overflow-y: auto;
  padding: 12px;
}

.image-options {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}

.image-option {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  aspect-ratio: 1;
  padding: 5px;
  border: 1px solid #ddd;
  border-radius: 0;
  background: white;
}

.image-option:hover {
  border-color: #777;
  background: #f8f8f8;
}

.image-option img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.clear-option {
  display: block;
  margin: 12px auto 0;
}

@media (min-width: 1100px) {
  .parts-grid {
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }
}

@media (min-width: 700px) and (max-width: 1099px) {
  .parts-grid {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .part-preview {
    height: 100px;
  }
}

@media (max-width: 699px) {
  main {
    padding: 12px;
  }

  header h1 {
    font-size: 21px;
  }

  .parts-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 5px;
  }

  .part-category {
    font-size: 12px;
  }

  .part-preview {
    height: 90px;
  }

  .image-options {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
</style>
</head>

<body>
<header>
  <!-- 문구 수정 영역 -->
  <h1 id="siteTitle">아이프리 마이캐릭터 도감</h1>
</header>

<main>
  <div class="character-tools">
    <select id="characterSelect" aria-label="캐릭터 선택"></select>
    <button id="addCharacter">캐릭터 추가</button>
    <input id="nameInput" placeholder="이름 입력" aria-label="캐릭터 이름">
    <button id="saveName">이름 적용</button>
    <button id="deleteCharacter">캐릭터 삭제</button>
  </div>

  <div class="name-area">
    <span class="name-label">이름</span>
    <span id="displayName"></span>
  </div>

  <p id="message"></p>

  <div id="partsGrid" class="parts-grid"></div>
</main>

<div id="partModal" class="modal" role="dialog"
     aria-modal="true" aria-label="파츠 선택">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">파츠 선택</h2>
      <button id="closeModal" aria-label="닫기">닫기</button>
    </div>
    <div class="modal-body">
      <div id="imageOptions" class="image-options"></div>
      <button id="clearPart" class="clear-option">선택 해제</button>
    </div>
  </div>
</div>

<script>
/* ==========================================
   문구 수정 영역
   사이트에 표시되는 문구는 여기서 수정합니다.
========================================== */
const TEXT = {
  title: "아이프리 마이캐릭터 도감",
  addCharacter: "캐릭터 추가",
  saveName: "이름 적용",
  deleteCharacter: "캐릭터 삭제",
  namePlaceholder: "이름 입력",
  choosePart: "파츠 선택",
  close: "닫기",
  clearPart: "선택 해제",
  noCharacters: "캐릭터 추가",
  askName: "새 캐릭터 이름을 입력하세요.",
  confirmDelete: "선택한 캐릭터를 삭제할까요?",
  emptyName: "이름을 입력해 주세요.",
  added: "캐릭터를 추가했습니다.",
  deleted: "캐릭터를 삭제했습니다.",
  saved: "이름을 적용했습니다.",
  selected: "파츠를 선택했습니다.",
  cleared: "파츠 선택을 해제했습니다.",
  noParts: "등록된 이미지가 없습니다."
};

/* ==========================================
   파츠 종류
========================================== */
const CATEGORIES = [
  "얼굴",
  "보이스",
  "피부",
  "앞머리",
  "뒷머리",
  "헤어 컬러",
  "아이 컬러",
  "메시 타입",
  "메시 컬러",
  "헤어 데코",
  "메이크업",
  "원 포인트",
  "부탁해 주얼"
];

/* ==========================================
   파츠 이미지 및 이름
   새 이미지도 이 목록에 추가할 수 있습니다.
========================================== */
const PARTS = {
  "얼굴": [
    { image: "images/parts/Face_0001.webp", label: "おとめ" },
    { image: "images/parts/Face_0002.webp", label: "げんき" },
    { image: "images/parts/Face_0003.webp", label: "ほんわか" },
    { image: "images/parts/Face_0004.webp", label: "ひたむき" },
    { image: "images/parts/Face_0005.webp", label: "ハツラツ" },
    { image: "images/parts/Face_0006.webp", label: "ビューティー" },
    { image: "images/parts/Face_0007.webp", label: "ロマンチック" },
    { image: "images/parts/Face_0008.webp", label: "ミステリアス" }
  ],
  "보이스": [],
  "피부": [],
  "앞머리": [],
  "뒷머리": [],
  "헤어 컬러": [],
  "아이 컬러": [],
  "메시 타입": [],
  "메시 컬러": [],
  "헤어 데코": [],
  "메이크업": [],
  "원 포인트": [],
  "부탁해 주얼": []
};

/* 캐릭터 목록은 비워 둡니다. */
let characters = [];
let current = -1;
let activeCategory = null;

const $ = id => document.getElementById(id);

function setMessage(text) {
  $("message").textContent = text;
}

function renderCharacters() {
  const select = $("characterSelect");
  select.innerHTML = "";

  if (characters.length === 0) {
    current = -1;
    const option = document.createElement("option");
    option.value = "";
    option.textContent = TEXT.noCharacters;
    select.appendChild(option);
    $("nameInput").value = "";
    $("displayName").textContent = "";
  } else {
    if (current < 0 || current >= characters.length) current = 0;

    characters.forEach((character, index) => {
      const option = document.createElement("option");
      option.value = index;
      option.textContent = character.name;
      select.appendChild(option);
    });

    select.value = String(current);
    $("nameInput").value = characters[current].name;
    $("displayName").textContent = characters[current].name;
  }

  renderParts();
}

function renderParts() {
  const grid = $("partsGrid");
  grid.innerHTML = "";

  CATEGORIES.forEach(category => {
    const card = document.createElement("div");
    card.className = "part-card";

    const heading = document.createElement("div");
    heading.className = "part-category";
    heading.textContent = category;

    const previewButton = document.createElement("button");
    previewButton.className = "part-preview";
    previewButton.setAttribute("aria-label", category + " 선택");

    const selectedLabel = current >= 0
      ? characters[current].selections[category]
      : null;

    const selectedPart = (PARTS[category] || []).find(
      part => part.label === selectedLabel
    );

    if (selectedPart) {
      const image = document.createElement("img");
      image.src = selectedPart.image;
      image.alt = selectedPart.label;

      image.onerror = () => {
        previewButton.innerHTML = "";
        const empty = document.createElement("span");
        empty.className = "part-empty";
        empty.textContent = "—";
        previewButton.appendChild(empty);
      };

      previewButton.appendChild(image);
    } else {
      const empty = document.createElement("span");
      empty.className = "part-empty";
      empty.textContent = "—";
      previewButton.appendChild(empty);
    }

    previewButton.disabled = current < 0 ||
      (PARTS[category] || []).length === 0;

    previewButton.addEventListener("click", () => openModal(category));

    const label = document.createElement("div");
    label.className = "part-label";
    label.textContent = selectedPart ? selectedPart.label : "";

    const action = document.createElement("button");
    action.className = "part-action";
    action.textContent = TEXT.choosePart;
    action.disabled = current < 0 ||
      (PARTS[category] || []).length === 0;
    action.addEventListener("click", () => openModal(category));

    card.append(heading, previewButton, label, action);
    grid.appendChild(card);
  });
}

function openModal(category) {
  if (current < 0) return;

  activeCategory = category;
  $("modalTitle").textContent = category;
  const options = $("imageOptions");
  options.innerHTML = "";

  const availableParts = PARTS[category] || [];

  availableParts.forEach(part => {
    const button = document.createElement("button");
    button.className = "image-option";
    button.setAttribute("aria-label", part.label);
    button.title = part.label;

    const image = document.createElement("img");
    image.src = part.image;
    image.alt = part.label;

    image.onerror = () => {
      button.remove();
    };

    button.appendChild(image);
    button.addEventListener("click", () => {
      if (current < 0) return;

      characters[current].selections[category] = part.label;
      closeModal();
      renderParts();
      setMessage(TEXT.selected);
    });

    options.appendChild(button);
  });

  $("partModal").classList.add("open");
}

function closeModal() {
  $("partModal").classList.remove("open");
  activeCategory = null;
}

$("closeModal").addEventListener("click", closeModal);

$("partModal").addEventListener("click", event => {
  if (event.target === $("partModal")) closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});

$("clearPart").addEventListener("click", () => {
  if (current < 0 || !activeCategory) return;

  delete characters[current].selections[activeCategory];
  closeModal();
  renderParts();
  setMessage(TEXT.cleared);
});

$("characterSelect").addEventListener("change", () => {
  current = Number($("characterSelect").value);
  renderCharacters();
});

$("addCharacter").addEventListener("click", () => {
  const name = prompt(TEXT.askName);
  if (!name || !name.trim()) return;

  characters.push({
    name: name.trim(),
    selections: {}
  });

  current = characters.length - 1;
  renderCharacters();
  setMessage(TEXT.added);
});

$("saveName").addEventListener("click", () => {
  if (current < 0) return;

  const name = $("nameInput").value.trim();
  if (!name) {
    setMessage(TEXT.emptyName);
    return;
  }

  characters[current].name = name;
  renderCharacters();
  setMessage(TEXT.saved);
});

$("deleteCharacter").addEventListener("click", () => {
  if (current < 0) return;
  if (!confirm(TEXT.confirmDelete)) return;

  characters.splice(current, 1);
  current = characters.length ? Math.min(current, characters.length - 1) : -1;
  renderCharacters();
  setMessage(TEXT.deleted);
});

$("siteTitle").textContent = TEXT.title;
$("addCharacter").textContent = TEXT.addCharacter;
$("saveName").textContent = TEXT.saveName;
$("deleteCharacter").textContent = TEXT.deleteCharacter;
$("nameInput").placeholder = TEXT.namePlaceholder;
$("closeModal").textContent = TEXT.close;
$("clearPart").textContent = TEXT.clearPart;

renderCharacters();
</script>
</body>
</html>
